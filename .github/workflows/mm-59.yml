name: MM-59

# Debugging Linear MM-59, on its branch only: concurrentSubscriptionsKeepCount
# crashes in libdispatch on Linux aarch64 (a LISTLESS pointer, an item
# enqueued twice). Run 1: it crashes alone, in 5 of 15 and 7 of 17 processes
# with either pair of fp-swift and hegel-swift versions; x86_64 never. Run 2
# takes one layer away at a time (MM59Probes.swift), each in a job of its own
# on aarch64, with the property itself as the control.
on:
  push:
    branches: ["v/mm-59-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: MM-59 on Linux aarch64, ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # About 4 minutes a process: 5,000 cases, as the nightly.
          - name: the property (control)
            filter: SubscriptionProperties/concurrentSubscriptionsKeepCount
            rounds: "1"
          # B: hegel's concurrent machine with plain streams, 5,000 cases.
          - name: hegel with plain streams
            filter: MM59Probes/hegelPlainStreams
            rounds: "1"
          # C and D: a plain task group, sized to run about as long here as
          # the property (26 s on an M-series Mac, where it takes 35 s).
          - name: a loop with plain streams
            filter: MM59Probes/loopPlainStreams
            rounds: "800000"
          - name: a loop with registerSignals
            filter: MM59Probes/loopRealSignals
            rounds: "300000"
    container:
      image: swift:6.4
    env:
      # The runtime's backtracer, on a crash: every thread, with source lines.
      SWIFT_BACKTRACE: enable=yes,threads=all,sanitize=yes
      # Randomized, as the nightly: each process draws new inputs.
      HEGEL_DEFAULT_PROFILE: nightly
      HEGEL_TEST_CASES: "5000"
      # Turns the probes on; the loops' round count.
      MM59_ROUNDS: ${{ matrix.rounds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the machine and Swift
        run: |
          uname -a
          nproc
          swift --version

      - name: Build the tests
        run: swift build --build-tests

      - name: 12 processes
        env:
          FILTER: ${{ matrix.filter }}
        run: .github/scripts/mm-59-processes.sh 12 "$FILTER"
