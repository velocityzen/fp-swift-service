name: Property tests

# The Hegel property tests, deep: each property at 25 times its own count,
# randomized (about 25 minutes on the macOS runner, where the real-signal
# state machines are slowest). Pushes and pull requests run them
# in the Test jobs of ci.yml, at each property's own count, with CI's
# derandomized profile, so they see the same inputs every time; this run is
# where new inputs come from.
on:
  schedule:
    # Daily at 06:41 UTC, off the hour, when scheduled runs pile up.
    - cron: "41 6 * * *"
  workflow_dispatch:

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Selects hegel.toml's nightly profile, randomized, over CI's.
  HEGEL_DEFAULT_PROFILE: nightly
  # Multiplies each property's own count, so the costs stay relative: the
  # real-signal state machines' 200 and 300 become 5,000 and 7,500, the pure
  # helpers' 1,000 and 2,000 become 25,000 and 50,000. At 25 the macOS job
  # takes about as long as 10,000 cases each did (29 minutes); 50 would come
  # near its 60-minute limit. HEGEL_TEST_CASES would still win over it.
  HEGEL_TEST_CASES_SCALE: "25"

jobs:
  macos:
    name: Property tests macOS
    # Package.swift needs macOS 27, which only the xcode-27 image (a public
    # preview) runs; macos-26 can't launch what it builds.
    runs-on: xcode-27
    env:
      # The SDK swift.org's toolchain builds against: Xcode 27.1's, as in
      # the simulator jobs, so a change of the image's default Xcode cannot
      # change it.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Swift
        uses: $/.github/actions/setup-swift
        with:
          swift-version: "6.4"

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter PropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      # Each failure's report, from the issue through its test's "failed
      # after" line. A Hegel report ends with the trait that replays it, so
      # the failing case can be run locally. A report can be any length: a
      # draw may print across many lines.
      - name: Show failures
        if: failure()
        run: |
          awk '
            /recorded an issue/ { shown = 0; on = 1 }
            on { print; shown++ }
            on && (/failed after/ || shown >= 200) { on = 0; print "" }
          ' "$RUNNER_TEMP/property-tests.log" | cut -c1-400

  linux:
    name: Property tests Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter PropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      - name: Show failures
        if: failure()
        shell: bash
        run: |
          awk '
            /recorded an issue/ { shown = 0; on = 1 }
            on { print; shown++ }
            on && (/failed after/ || shown >= 200) { on = 0; print "" }
          ' "$RUNNER_TEMP/property-tests.log" | cut -c1-400
