name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # swiftly (swift.org's toolchain installer) for the jobs that install Swift
  # on macOS. The versioned .pkg is pinned and checked, like SwiftLint, so a
  # new swiftly release cannot change CI unnoticed.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    env:
      # swift-format comes with the toolchain, so it is pinned with it.
      SWIFT_VERSION: "6.4"
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          swift format --version
          swiftlint --version

      - name: swift-format (lint mode, strict)
        run: swift format lint --recursive --strict --configuration .swift-format Sources Tests

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Docs show the Example verbatim
        run: python3 Scripts/check-docs.py

  macos:
    name: Test macOS
    runs-on: macos-26
    env:
      SWIFT_VERSION: "6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's default Xcode may ship an older Swift; install the exact
      # toolchain with swiftly (swift.org's installer) so macOS and Linux
      # build with the same compiler.
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

  apple:
    name: Build ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # The platforms Package.swift declares besides macOS.
        platform: [iOS, tvOS, watchOS, visionOS]
    env:
      # swift-tools-version 6.3 needs Xcode 26.4 or later; Xcode 26.6 ships
      # Swift 6.3.3. Selected explicitly so a change of the image's default
      # Xcode cannot change the compiler or SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      # Only the library products: Example and ServiceFixture are command-line
      # tools for macOS and Linux.
      - name: Build FPService and ProcessSignals
        run: |
          for scheme in FPService ProcessSignals; do
            xcodebuild build -scheme "$scheme" -destination "generic/platform=$PLATFORM"
          done

  linux:
    name: Test Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the package's swift-tools-version, the oldest compiler it
        # claims to support; 6.4 is the compiler the other jobs use.
        swift: ["6.3", "6.4"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

  musl:
    name: Build static Linux (Musl)
    runs-on: ubuntu-latest
    # A Swift SDK only works with the exact compiler release it was built for,
    # so the image is pinned to the SDK's patch release (swift:6.4 moves on
    # when 6.4.2 ships). Update the image and the SDK together.
    container:
      image: swift:6.4.1
    env:
      # "Swift SDK for Static Linux" from https://www.swift.org/install/linux/
      STATIC_SDK_URL: https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_SHA256: cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Install the Static Linux SDK
        run: |
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA256"
          swift sdk list

      - name: Resolve dependencies
        run: swift package resolve

      # Without --build-tests: the Static Linux SDK ships neither Testing nor
      # XCTest, so the test targets cannot be built for Musl.
      - name: Build
        run: swift build -v --swift-sdk x86_64-swift-linux-musl

      # The runner is x86_64 Linux, so the static binary runs as is. Since the
      # tests cannot be built for Musl, this is where the Musl code runs.
      - name: Run the static Example
        run: timeout 60 "$(swift build --swift-sdk x86_64-swift-linux-musl --show-bin-path)/Example" job
