name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Swift is swift.org's: installed by .github/actions/setup-swift on the
# runners, or the image's in the Linux containers (the simulator jobs use
# Xcode's). The longer shell steps are in .github/scripts.
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # swift-format comes with the toolchain, so it is pinned with it.
      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4"

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          swift format --version
          swiftlint --version

      - name: swift-format (lint mode, strict)
        run: swift format lint --recursive --strict --configuration .swift-format Sources Tests

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Docs show the Example verbatim
        run: python3 Scripts/check-docs.py

  macos:
    name: Test macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's default Xcode may ship an older Swift; install the exact
      # toolchain so macOS and Linux build with the same compiler.
      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      # macOS only. On Linux, a contended `Mutex` (Synchronization) is taken
      # in `_lockSlow`, which lives in the uninstrumented standard library,
      # so TSan misses that acquire and reports races on state the mutex
      # guards (Swift 6.4.1).
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

  apple:
    name: Test ${{ matrix.platform }} Simulator
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # The platforms Package.swift declares besides macOS, each on the
        # first simulator of its kind the image has.
        include:
          - platform: iOS
            device: iPhone
          - platform: tvOS
            device: Apple TV
          - platform: watchOS
            device: Apple Watch
          - platform: visionOS
            device: Apple Vision
    env:
      # swift-tools-version 6.3 needs Xcode 26.4 or later; Xcode 26.6 ships
      # Swift 6.3.3. Selected explicitly so a change of the image's default
      # Xcode cannot change the compiler or SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      # Every test but the ones that launch a process (macOS, Linux and
      # Android only): the simulators can't run the fixture.
      - name: Test on the ${{ matrix.platform }} Simulator
        run: .github/scripts/test-simulator.sh "${{ matrix.device }}"

  linux:
    name: Test Linux ${{ matrix.arch }} (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the package's swift-tools-version, the oldest compiler it
        # claims to support; 6.4 is the compiler the other jobs use.
        swift: ["6.3", "6.4"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test --enable-code-coverage

      # The Linux signal code only builds here, so this is the only coverage
      # of it.
      - name: Coverage
        run: .github/scripts/coverage-report.sh "Linux ${{ matrix.arch }}, Swift ${{ matrix.swift }}"

  windows:
    name: Test Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4.2"

      - name: Build
        run: swift build

      # Console events reach the process through the handler routine in the
      # tests, except Ctrl-Break, sent for real to a fixture process. That
      # test is skipped if the runner gives the job no console.
      - name: Test
        run: swift test

  musl:
    name: Build static Linux (Musl)
    runs-on: ubuntu-latest
    # A Swift SDK only works with the exact compiler release it was built for,
    # so the image is pinned to the SDK's patch release (swift:6.4 moves on
    # when 6.4.2 ships). Update the image and the SDK together.
    container:
      image: swift:6.4.1
    env:
      # "Swift SDK for Static Linux" from https://www.swift.org/install/linux/
      STATIC_SDK_URL: https://download.swift.org/swift-6.4.1-release/static-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      STATIC_SDK_SHA256: cef5592d7430ed3c5ae1ddda479849c6f5252bd94a5723db1559f984caf38a7c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Install the Static Linux SDK
        run: |
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA256"
          swift sdk list

      - name: Resolve dependencies
        run: swift package resolve

      # Without --build-tests: the Static Linux SDK ships neither Testing nor
      # XCTest, so the test targets cannot be built for Musl.
      - name: Build
        run: swift build -v --swift-sdk x86_64-swift-linux-musl

      # The runner is x86_64 Linux, so the static binary runs as is. Since the
      # tests cannot be built for Musl, this is where the Musl code runs.
      - name: Run the static Example
        run: timeout 60 "$(swift build --swift-sdk x86_64-swift-linux-musl --show-bin-path)/Example" job

      # `job` ends by itself; `requests` runs until a signal, so this is what
      # runs Musl's signal handler and pipe.
      - name: Stop the static Example with SIGTERM
        timeout-minutes: 2
        run: |
          .github/scripts/stop-example-with-sigterm.sh \
            "$(swift build --swift-sdk x86_64-swift-linux-musl --show-bin-path)/Example"

  android:
    name: Test Android (emulator)
    runs-on: ubuntu-latest
    env:
      # A Swift SDK only works with the exact compiler release it was built
      # for, so the toolchain and the SDK are pinned together.
      SWIFT_VERSION: "6.4.2"
      # "Swift SDK for Android" from https://www.swift.org/install/
      ANDROID_SDK_URL: https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz
      ANDROID_SDK_SHA256: 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      ANDROID_SDK_ID: swift-6.4.2-RELEASE_android
      # The NDK release the SDK is made for; the runner image has it.
      ANDROID_NDK_MAJOR: "30"
      # The first API level with `posix_spawn`, which the tests use to
      # launch the fixture.
      ANDROID_API: "28"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      # The SDK's setup script links the NDK's headers and libraries in. The
      # build itself finds the NDK through ANDROID_NDK_ROOT or
      # ANDROID_NDK_HOME first, which the image sets to an older one (whose
      # headers Swift imports differently), so both are pointed at it too.
      - name: Install the Swift SDK for Android
        run: |
          swift sdk install "$ANDROID_SDK_URL" --checksum "$ANDROID_SDK_SHA256" --swift-sdks-path "$RUNNER_TEMP/swift-sdks"
          ndk="$(ls -d "$ANDROID_HOME/ndk/$ANDROID_NDK_MAJOR".* | tail -n 1)"
          ANDROID_NDK_HOME="$ndk" "$RUNNER_TEMP/swift-sdks/$ANDROID_SDK_ID.artifactbundle/swift-android/scripts/setup-android-sdk.sh"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: swift package resolve

      # Every architecture the SDK has, tests included: armv7 is 32-bit, and
      # Bionic lays out `sigaction` differently there. Only x86_64 runs, on
      # the emulator below.
      - name: Build
        run: |
          for arch in aarch64 armv7 x86_64; do
            echo "== $arch"
            swift build --build-tests --swift-sdks-path "$RUNNER_TEMP/swift-sdks" \
              --swift-sdk "$ANDROID_SDK_ID" --triple "$arch-unknown-linux-android$ANDROID_API"
          done

      # The script gives the boot 10 minutes, and shows the emulator's log
      # if it fails.
      - name: Start the Android emulator
        timeout-minutes: 15
        run: .github/scripts/android-start-emulator.sh "$ANDROID_API"

      - name: Test on the Android emulator
        timeout-minutes: 15
        run: |
          .github/scripts/android-test.sh "$RUNNER_TEMP/swift-sdks" "$ANDROID_SDK_ID" \
            "x86_64-unknown-linux-android$ANDROID_API"
