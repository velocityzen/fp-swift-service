name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install swift-format and SwiftLint
        run: brew install swift-format swiftlint

      - name: Show tool versions
        run: |
          swift-format --version
          swiftlint --version

      - name: swift-format (lint mode, strict)
        run: swift-format lint --recursive --strict --configuration .swift-format Sources Tests

      - name: SwiftLint (strict)
        run: swiftlint --strict

  macos:
    name: Test macOS
    runs-on: macos-26
    env:
      SWIFT_VERSION: "6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's default Xcode may ship an older Swift; install the exact
      # toolchain with swiftly (swift.org's installer) so macOS and Linux
      # build with the same compiler.
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

  linux:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
